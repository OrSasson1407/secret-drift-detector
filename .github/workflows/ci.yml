name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.2"

jobs:

  # ── Lint & type-check ───────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry install
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-${{ env.POETRY_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Mypy
        run: poetry run mypy detector --ignore-missing-imports


  # ── Unit tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev

      - name: Run unit tests
        run: poetry run pytest tests/unit -v --tb=short --junitxml=junit-unit-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit-${{ matrix.python-version }}
          path: junit-unit-${{ matrix.python-version }}.xml


  # ── Integration tests ───────────────────────────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev

      - name: Run integration tests
        run: poetry run pytest tests/integration -v --tb=short --junitxml=junit-integration.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: junit-integration.xml


  # ── Docker build ────────────────────────────────────────────────────────────
  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          target:  runtime
          push:    false
          tags:    secret-drift-detector:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Smoke test — health endpoint
        run: |
          # Start the API container with a minimal config
          cat > /tmp/detector.toml << 'EOF'
          [agent]
          interval_seconds = 60
          alert_on_extra   = false
          fail_on_drift    = false

          [[sources]]
          type = "dotenv"
          path = "/app/config/.env.test"

          [[targets]]
          type = "local_env"
          EOF

          echo "TEST_VAR=hello" > /tmp/.env.test

          docker run -d --name drift_smoke \
            -p 8000:8000 \
            -v /tmp/detector.toml:/app/config/detector.toml:ro \
            -v /tmp/.env.test:/app/config/.env.test:ro \
            secret-drift-detector:ci

          # Wait for the server to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/v1/health; then
              echo ""; echo "Health check passed"; break
            fi
            echo "Waiting... ($i/15)"; sleep 2
          done

          # Assert health response
          RESPONSE=$(curl -sf http://localhost:8000/api/v1/health)
          echo "$RESPONSE" | grep -q '"ok"' || (echo "Unexpected response: $RESPONSE" && exit 1)

      - name: Dump container logs on failure
        if: failure()
        run: docker logs drift_smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f drift_smoke || true


  # ── Drift gate (CI gate mode) ────────────────────────────────────────────────
  drift-gate:
    name: Drift gate check
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    # Only run on pushes to main, not on every PR to save time
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --without dev

      - name: Write CI detector config
        run: |
          cat > /tmp/ci-detector.toml << 'EOF'
          [agent]
          interval_seconds = 60
          alert_on_extra   = false
          fail_on_drift    = true

          [[sources]]
          type = "dotenv"
          path = ".env.production"

          [[targets]]
          type = "local_env"
          EOF

      - name: Run drift check
        env:
          VAULT_TOKEN:  ${{ secrets.VAULT_TOKEN }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          poetry run detector check \
            --config /tmp/ci-detector.toml \
            --output table \
            --min-severity warn
        # exits 1 if drift found → fails the pipeline
        continue-on-error: false


  # ── Publish image (on tag) ───────────────────────────────────────────────────
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [integration-tests, docker]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target:  runtime
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
