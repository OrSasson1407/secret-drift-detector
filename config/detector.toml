[agent]
interval_seconds = 60
alert_on_extra = false
fail_on_drift = true

[[sources]]
type = 'vault'
addr = 'https://vault.internal:8200'
path = 'secret/data/production/app'

[[sources]]
type = 'ssm'
prefix = '/production/myapp/'
region = 'us-east-1'

[[sources]]
type = 'dotenv'
path = '.env.example'

[[targets]]
type = 'docker'
container = 'myapp_web_1'

[[targets]]
type = 'proc'
pid_file = '/var/run/myapp.pid'

[alerts.slack]
enabled = true
webhook_url = 'env:SLACK_DRIFT_WEBHOOK'
min_severity = 'warn'

[alerts.pagerduty]
enabled = true
integration_key = 'env:PD_INTEGRATION_KEY'
min_severity = 'critical'
